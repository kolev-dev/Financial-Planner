services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financial_planner
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./financial_planner_dump.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
